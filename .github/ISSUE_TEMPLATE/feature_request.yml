name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like the add-on to do?
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: This add-on is privacy-first, so new features that send data somewhere new need extra care.
      options:
        - label: This feature would not send message content to any service other than the one the user selected
